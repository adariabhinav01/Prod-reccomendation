<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$page_title</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #111;
    --bg: #fff;
    --muted: #666;
    --border: #ddd;
    --banner-bg: #fff6e0;
    --banner-border: #d9a441;
  }
  body {
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--fg);
    background: var(--bg);
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 16px 64px;
    line-height: 1.45;
  }
  h1 { font-size: 1.7rem; margin-bottom: 0.2em; }
  h2 { font-size: 1.25rem; margin-top: 2em; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
  h3 { font-size: 1rem; margin-top: 1.2em; }
  section { margin-bottom: 1.5em; }
  .banner {
    border: 1px solid var(--banner-border);
    background: var(--banner-bg);
    padding: 12px 16px;
    border-radius: 6px;
    margin: 1em 0;
  }
  .verdict.insufficient-evidence { border-left: 4px solid #b6432c; padding-left: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
  th, td { border: 1px solid var(--border); padding: 6px 8px; vertical-align: top; text-align: left; }
  th { background: rgba(127,127,127,0.08); }
  tr.reference-row { opacity: 0.75; }
  .role-note { font-size: 0.8em; color: var(--muted); font-style: italic; }
  .spec-missing { color: var(--muted); text-align: center; }
  .flag { font-size: 0.85em; margin-left: 2px; }
  .flag.conflict { color: #b6432c; }
  .flag.corroborated { color: #2f6f4f; }
  .inline-caveats { font-size: 0.8em; color: var(--muted); margin: 4px 0 0; padding-left: 1.1em; }
  .flip-point { font-size: 0.85em; color: var(--muted); max-width: 220px; }
  .confidence-flag { color: #9f4f4f; font-size: 0.85em; }
  ul { margin: 0.2em 0; padding-left: 1.2em; }
  details { border: 1px solid var(--border); border-radius: 6px; margin: 0.6em 0; padding: 8px 12px; }
  summary { cursor: pointer; font-weight: 600; }
  .scale svg { width: 100%; height: auto; max-width: 760px; }
  small { color: var(--muted); }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #eee;
      --bg: #16171a;
      --muted: #9aa0a6;
      --border: #33363b;
      --banner-bg: #3a2f10;
      --banner-border: #b98a2f;
    }
    th { background: rgba(255,255,255,0.06); }
  }
</style>
</head>
<body>
$body
</body>
</html>
