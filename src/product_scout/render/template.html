<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__REPORT_TITLE__</title>
<style>
  :root {
    color-scheme: light;
    --ink: #1a1a1a;
    --muted: #5a5a5a;
    --border: #ddd;
    --band: #cfe0ff;
    --top-pick: #1a6b3c;
    --banner-bg: #fff4e5;
    --banner-border: #d98a1e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: #fff;
    line-height: 1.5;
    max-width: 960px;
    margin-inline: auto;
  }
  header { margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
  header .generated-at { color: var(--muted); font-size: 0.85rem; }
  section { margin-bottom: 2.5rem; }
  h1 { font-size: 1.5rem; }
  h2 { font-size: 1.15rem; border-bottom: 1px solid var(--border); padding-bottom: 0.3rem; }
  h3 { font-size: 1rem; margin-bottom: 0.3rem; }
  table.comparison-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  table.comparison-table th, table.comparison-table td {
    border: 1px solid var(--border);
    padding: 0.5rem;
    text-align: left;
    vertical-align: top;
  }
  table.comparison-table th { background: #f5f5f5; }
  ul { margin: 0.2rem 0; padding-left: 1.2rem; }
  .banner {
    padding: 1rem;
    border-radius: 6px;
    margin-bottom: 1.5rem;
  }
  .banner-low-evidence {
    background: var(--banner-bg);
    border: 1px solid var(--banner-border);
  }
  .scope-shift-note { color: var(--muted); font-style: italic; }
  .confidence-band { fill: var(--band); }
  .datapoint-marker { fill: var(--ink); }
  .datapoint-marker.top-pick { fill: var(--top-pick); }
  .scale-axis, .scale-tick { stroke: var(--muted); stroke-width: 1; }
  .scale-tick-label { font-size: 11px; fill: var(--muted); }
  .datapoint-label { font-size: 12px; fill: var(--ink); }
  .flip-connector { stroke: var(--muted); stroke-width: 1; }
  .flip-ghost { fill: none; stroke: var(--muted); stroke-width: 1.5; opacity: 0.5; }
  .flip-label, .flip-note { font-size: 11px; fill: var(--muted); font-style: italic; }
  .scoring-anchor { font-size: 11px; fill: var(--muted); }
  .band-legend { font-size: 11px; fill: var(--muted); font-weight: bold; }
  code, .source-url { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.85rem; }
</style>
</head>
<body>
<header>
  <h1>__REPORT_TITLE__</h1>
  <div class="generated-at">Generated __GENERATED_AT__</div>
</header>
<main>__REPORT_BODY__</main>
</body>
</html>
